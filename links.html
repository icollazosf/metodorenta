<style>
/* Layout: una sola columna de celdas (B1–B4), cada link es una celda. Siempre clara. */
:root{
  --verde:#12754A; --menta:#DFF3E6; --tinta:#13201A; --blanco:#FFFFFF; --rejilla:#D9DED9;
  --amarillo:#F6CF3A; --naranja:#F2602F; --bg:#F7F9F7; --muted:#56645C;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:linear-gradient(var(--rejilla) 1px,transparent 1px),linear-gradient(90deg,var(--rejilla) 1px,transparent 1px);background-size:120px 40px;background-position:-1px -1px;color:var(--tinta);font-family:var(--f-display);font-size:16px;line-height:1.5;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding-block:40px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.card{background:var(--blanco);border:1px solid var(--rejilla);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:28px 20px}
.ant{width:120px;height:120px;background:var(--amarillo);display:grid;place-items:center;overflow:hidden}
.ant img{width:112px;height:auto;display:block}
.logo{display:flex;align-items:center;gap:12px}
.logo .m{font-family:var(--f-mono);font-size:11px;letter-spacing:.35em;color:var(--verde);font-weight:500}
.logo .box{position:relative;border:2px solid var(--verde);padding:3px 12px;font-weight:700;font-size:22px;letter-spacing:.02em}
.logo .box::after{content:"";position:absolute;right:-5px;bottom:-5px;width:8px;height:8px;background:var(--verde)}
.card p{margin:0;color:var(--muted);max-width:34ch}
.card p b{color:var(--tinta)}
.tags{font-family:var(--f-mono);font-size:12px;color:var(--verde)}
.links{display:flex;flex-direction:column;gap:12px}
.lk{position:relative;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--blanco);border:1px solid var(--rejilla);padding:14px 16px;text-decoration:none;color:var(--tinta);transition:border-color .15s,transform .15s}
.lk .ref{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:22px}
.lk .ic{width:44px;height:44px;display:grid;place-items:center}
.lk.wa .ic{background:#1FA855;color:var(--blanco)}
.lk.ig .ic{background:var(--naranja);color:var(--blanco)}
.lk.tt .ic{background:var(--tinta);color:var(--blanco)}
.lk.ss .ic{background:var(--amarillo);color:var(--tinta)}
.lk .tx{display:flex;flex-direction:column;min-width:0}
.lk b{font-size:18px}
.lk small{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .go{font-size:20px;color:var(--verde)}
.lk:hover,.lk:focus-visible{border:1px solid var(--verde);box-shadow:inset 0 0 0 2px var(--verde);outline:none}
.lk:hover::after,.lk:focus-visible::after{content:"";position:absolute;right:-6px;bottom:-6px;width:10px;height:10px;background:var(--verde);border:2px solid var(--blanco)}
.lk.wa{border:3px solid var(--verde)}
.lk.wa::after{content:"";position:absolute;right:-7px;bottom:-7px;width:12px;height:12px;background:var(--verde);border:2px solid var(--blanco)}
footer{text-align:center;font-size:12px;color:var(--muted);font-family:var(--f-mono)}

/* Clic más evidente */
.lk{box-shadow:5px 5px 0 var(--tinta);border:2px solid var(--tinta);transition:transform .12s,box-shadow .12s}
.lk:hover,.lk:focus-visible{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--verde);border:2px solid var(--verde)}
.lk:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--tinta)}
.lk .go{width:36px;height:36px;display:grid;place-items:center;background:var(--menta);font-weight:700}
.lk:hover .go{background:var(--verde);color:var(--blanco)}
.lk.wa{border:3px solid var(--verde);box-shadow:5px 5px 0 var(--verde)}
.lk.wa .go{background:var(--verde);color:var(--blanco)}
.links{gap:16px}
.hint{text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--verde);margin:-8px 0 0}
@media (prefers-reduced-motion:no-preference){.lk.wa{animation:nudge 2.4s ease-in-out infinite}.lk.wa:hover{animation:none}}
@keyframes nudge{0%,80%,100%{transform:none}86%{transform:translate(-2px,-2px) rotate(-.6deg)}92%{transform:translate(-2px,-2px) rotate(.6deg)}}
</style>
<style>body{margin:0}img{max-width:100%}</style>
